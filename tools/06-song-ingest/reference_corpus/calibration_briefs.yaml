# Per-target calibration briefs for the Suno Calibration Prompt Bible.
#
# Each entry gives the instrument-specific knowledge the prompt composer
# folds into the SOLO and LEAD attempts. Fields:
#   character    — timbre/identity sketch
#   technique    — characteristic playing techniques/behaviors to expose
#   range        — useful register
#   articulation — attack/sustain/dynamics behavior
#   lead_support — restrained supporting context allowed in Lead mode
#
# Special flags:
#   vocalise: true   — target is a voice; Solo mode uses non-lexical
#                      vocalise (no lyrics)
#   catchall: true   — target is a broad/catch-all bucket (prompt adapts)

organ:
  character: "pipe, electric or digital organ; sustained, breath-like or drawbar tone with no natural note decay"
  technique: "open with a full-voiced sustained chord, move to a single-line melody over held chords, add registration/timbre shifts, finish with a slow swelled chord"
  range: "full keyboard, favoring the rich mid register"
  articulation: "legato sweeps, held chords, sharp staccato jabs; articulation comes from key attack and release, not decay"
  lead_support: "light unobtrusive bass far beneath"

piano:
  character: "acoustic grand piano; wide dynamic and timbral range, percussive attack with long natural decay"
  technique: "lone single-line melody, then arpeggios, then full chords, then bass-register octaves; pedal half-pedal color; finish with a long decaying chord"
  range: "low bass register to sparkling top"
  articulation: "legato pedaled phrases vs dry staccato; wide dynamic swings from pp to ff"
  lead_support: "very light brushed drums or soft bass far beneath"

electric_piano:
  character: "Rhodes/Wurlitzer electric piano; warm bell-like attack, mellow bark when played hard"
  technique: "comping stabs, rolled chords, single-line melody with tremolo-shake accents, glissando"
  range: "mid register centered"
  articulation: "soft TouchScale dynamics; tine bark on hard strikes; sustain with gentle wobble"
  lead_support: "soft upright bass and brushes far beneath"

keyboards:
  character: "general keyboard instrument; clean, defined tone"
  technique: "alternate chords, single lines and arpeggios; show both soft and bright patches"
  range: "full keyboard"
  articulation: "legato and staccato contrast, dynamic swells"
  lead_support: "minimal bass far beneath"

