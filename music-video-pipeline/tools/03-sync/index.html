<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 - Sync Lyrics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.app{display:flex;flex-direction:column;height:100%}

.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#16213e;border-bottom:1px solid #2a2a4a}
.header h1{font-size:16px;font-weight:600;color:#4cc9f0}
.header-actions{display:flex;gap:8px;align-items:center}
.save-status{font-size:12px;padding:4px 8px;border-radius:3px}
.save-status.saved{color:#48bb78}
.save-status.unsaved{color:#f6ad55}

.btn{padding:6px 14px;border:1px solid #2a2a4a;border-radius:4px;background:#2a2a4a;color:#e0e0e0;cursor:pointer;font-size:13px}
.btn:hover{background:#3a3a5a}
.btn-primary{background:#4cc9f0;border-color:#4cc9f0;color:#0f0f1a;font-weight:600}
.btn-primary:hover{background:#3ab8df}
.btn-danger{background:#f66;border-color:#f66;color:#fff}
.btn-danger:hover{background:#e55}
.btn-small{padding:4px 10px;font-size:12px}

.main{display:grid;grid-template-columns:280px 1fr;flex:1;overflow:hidden}

/* Left: Transcript */
.transcript{overflow-y:auto;background:#0f0f1a;border-right:1px solid #2a2a4a}
.transcript .section-header{padding:6px 12px;font-size:11px;font-weight:700;color:#4cc9f0;text-transform:uppercase;background:#16213e;position:sticky;top:0;z-index:1;letter-spacing:.5px}
.transcript .line-item{padding:6px 12px;cursor:pointer;border-left:3px solid transparent;font-size:13px;transition:background .1s}
.transcript .line-item:hover{background:#16213e}
.transcript .line-item.active{background:#16213e;border-left-color:#4cc9f0}
.transcript .line-item .line-text{margin-bottom:2px}
.transcript .line-item .time-range{font-size:10px;color:#666;font-family:monospace}
.transcript .line-item.active .time-range{color:#4cc9f0}
.word-span{padding:1px 2px;border-radius:2px;transition:background .1s,color .1s}
.word-span.active{background:#4cc9f0;color:#0f0f1a}
.conf-bar{display:inline-block;height:4px;border-radius:2px;vertical-align:middle;margin-left:6px}
.conf-high{background:#48bb78;width:30px}
.conf-med{background:#f6ad55;width:30px}
.conf-low{background:#f66;width:30px}

/* Right: Waveform + Word Layer + Detail */
.right-panel{display:flex;flex-direction:column;overflow:hidden}

.editor-area{flex:1;display:flex;flex-direction:column;min-height:0}

.waveform-container{height:80px;background:#0f0f1a;border-bottom:1px solid #2a2a4a;position:relative;cursor:crosshair;overflow:hidden}
.waveform-container canvas{width:100%;height:100%}
.beat-marker{position:absolute;top:0;width:1px;height:100%;background:rgba(76,201,240,0.2);pointer-events:none}
.playhead{position:absolute;top:0;width:2px;height:100%;background:#4cc9f0;z-index:5;pointer-events:none}

.word-layer{height:70px;background:#0a0a1a;border-bottom:1px solid #2a2a4a;position:relative;overflow:hidden}
.word-layer-inner{position:relative;height:100%}

.word{position:absolute;top:12px;height:40px;background:#2a4a6a;border-radius:4px;padding:0 10px;display:flex;align-items:center;cursor:grab;user-select:none;font-size:12px;color:#fff;white-space:nowrap;transition:background .1s}
.word:hover{background:#3a5a8a}
.word.active{background:#4cc9f0;color:#0f0f1a}
.word.dragging{cursor:grabbing;background:#4a6a9a;z-index:100}
.word.selected-line{border:1px solid #4cc9f0}
.word-handle{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:10}
.word-handle-left{left:0;border-radius:4px 0 0 4px}
.word-handle-left:hover{background:rgba(76,201,240,0.3)}
.word-handle-right{right:0;border-radius:0 4px 4px 0}
.word-handle-right:hover{background:rgba(76,201,240,0.3)}
.word .source-dot{width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0}
.source-dot.onset{background:#48bb78}
.source-dot.midi{background:#6c8cff}
.source-dot.vocal_onset{background:#f6ad55}
.source-dot.interpolated{background:#666}

.time-axis{height:20px;background:#0f0f1a;border-bottom:1px solid #2a2a4a;position:relative;font-size:10px;color:#666;font-family:monospace}
.time-axis .tick{position:absolute;top:0;height:100%;border-left:1px solid #2a2a4a;padding-left:3px;display:flex;align-items:flex-end;padding-bottom:2px}

/* Transport */
.transport{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#16213e;border-bottom:1px solid #2a2a4a;font-size:13px}
.transport .time{color:#4cc9f0;font-family:monospace;min-width:60px}
.transport .divider{color:#444}
.current-lyric{color:#888;margin-left:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}

/* Detail panel */
.detail-panel{height:200px;overflow-y:auto;background:#0f0f1a;border-top:1px solid #2a2a4a;padding:12px}
.detail-header{font-size:14px;color:#4cc9f0;font-weight:600;margin-bottom:4px}
.detail-meta{font-size:11px;color:#666;margin-bottom:10px;font-family:monospace}
.word-table{width:100%;border-collapse:collapse}
.word-table th{text-align:left;font-size:10px;color:#888;padding:2px 6px;border-bottom:1px solid #2a2a4a;text-transform:uppercase;letter-spacing:.5px}
.word-table td{padding:3px 6px;font-size:12px;border-bottom:1px solid #1a1a2e}
.word-table tr.active td{background:#16213e}
.word-table .time-input{width:65px;background:#16213e;border:1px solid #2a2a4a;color:#e0e0e0;padding:2px 4px;border-radius:3px;font-size:11px;font-family:monospace;text-align:right}
.word-table .time-input:focus{border-color:#4cc9f0;outline:none}
.source-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;text-transform:uppercase}
.source-badge.onset{background:rgba(72,187,120,0.2);color:#48bb78}
.source-badge.midi{background:rgba(108,140,255,0.2);color:#6c8cff}
.source-badge.vocal_onset{background:rgba(246,173,85,0.2);color:#f6ad55}
.source-badge.interpolated{background:rgba(102,102,102,0.2);color:#888}

/* Footer */
.footer{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#16213e;border-top:1px solid #2a2a4a}
.footer .status{font-size:12px;color:#666;margin-left:auto}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#1a1a2e}
::-webkit-scrollbar-thumb{background:#3a3a5a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#4a4a6a}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <h1>03 - Sync Lyrics</h1>
  <div class="header-actions">
    <span class="save-status" id="saveStatus"></span>
    <button class="btn" onclick="autoSync()">Auto-Sync</button>
    <button class="btn btn-primary" onclick="save()">Save</button>
  </div>
</div>

<div class="main">
  <div class="transcript" id="transcript"></div>

  <div class="right-panel">
    <div class="editor-area">
      <div class="waveform-container" id="waveformContainer">
        <canvas id="waveformCanvas"></canvas>
        <div id="playheadWave" class="playhead" style="left:0"></div>
      </div>
      <div class="word-layer" id="wordLayer">
        <div class="word-layer-inner" id="wordLayerInner"></div>
        <div id="playheadWords" class="playhead" style="left:0"></div>
      </div>
      <div class="time-axis" id="timeAxis"></div>
    </div>

    <div class="transport">
      <button class="btn btn-small" onclick="skipBack()">◀ 5s</button>
      <button class="btn btn-small" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="btn btn-small" onclick="skipForward()">5s ▶</button>
      <span class="time" id="currentTime">0:00.0</span>
      <span class="divider">/</span>
      <span class="time" id="totalTime">0:00.0</span>
      <span class="current-lyric" id="currentLyric"></span>
    </div>

    <div class="detail-panel" id="detailPanel">
      <p style="color:#666;font-size:13px">Select a line to view and edit word timing</p>
    </div>
  </div>
</div>

<div class="footer">
  <button class="btn btn-small" onclick="shiftAll(-0.5)">Shift −0.5s</button>
  <button class="btn btn-small" onclick="shiftAll(0.5)">Shift +0.5s</button>
  <button class="btn btn-small btn-danger" onclick="clearTiming()">Clear Timing</button>
  <span class="status" id="status">Loading...</span>
</div>

</div>

<script>
const API = '';
const MIN_WORD_DURATION = 0.15;

let audioCtx, audioBuffer, sourceNode;
let lyricsRaw = null;
let syncedData = null;
let analysisData = null;
let waveformPeaks = [];
let beatTimes = [];
let audioPath = '';
let isPlaying = false;
let startTime = 0;
let pauseOffset = 0;
let selectedLineIdx = -1;
let animFrame = null;
let hasUnsavedChanges = false;

let draggingWord = null;
let wordDragStartX = 0;
let wordDragStartTime = 0;
let wordDragEndTime = 0;
let dragType = 'move';

async function init() {
  try {
    const [projRes, rawRes, analysisRes, waveRes, syncedRes] = await Promise.all([
      fetch(`${API}/api/project`).then(r => r.json()),
      fetch(`${API}/api/lyrics-raw`).then(r => r.json()),
      fetch(`${API}/api/analysis`).then(r => r.json()),
      fetch(`${API}/api/waveforms`).then(r => r.json()),
      fetch(`${API}/api/lyrics-synced`).then(r => r.json()).catch(() => null),
    ]);

    if (projRes.error) { setStatus('No project loaded'); return; }
    lyricsRaw = rawRes;
    analysisData = analysisRes;
    waveformPeaks = waveRes.peaks || [];
    beatTimes = analysisRes.beat_times || [];
    syncedData = syncedRes && !syncedRes.error ? syncedRes : null;

    if (projRes.paths && projRes.paths.audio) {
      audioPath = `/data/${projRes.paths.audio}`;
    }

    document.getElementById('totalTime').textContent = fmtTime(analysisData.duration || 0);
    drawWaveform();
    renderTimeAxis();
    renderTranscript();
    renderWordLayer();
    setStatus(`Loaded: ${lyricsRaw.total_lines} lines, ${lyricsRaw.total_words} words`);

    if (audioPath) await loadAudio();
  } catch (e) {
    setStatus('Error: ' + e.message);
  }
}

async function loadAudio() {
  try {
    const res = await fetch(audioPath);
    const arrayBuf = await res.arrayBuffer();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    setStatus('Ready');
  } catch (e) {
    setStatus('Audio load error: ' + e.message);
  }
}

function togglePlay() {
  if (!audioCtx || !audioBuffer) return;
  if (isPlaying) {
    pauseOffset += audioCtx.currentTime - startTime;
    sourceNode.stop();
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶';
  } else {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.connect(audioCtx.destination);
    sourceNode.onended = () => { isPlaying = false; pauseOffset = 0; document.getElementById('playBtn').textContent = '▶'; };
    startTime = audioCtx.currentTime;
    sourceNode.start(0, pauseOffset);
    isPlaying = true;
    document.getElementById('playBtn').textContent = '⏸';
    updatePlayhead();
  }
}

function skipBack() { seekToTime(Math.max(0, getPlaybackTime() - 5)); }
function skipForward() { seekToTime(Math.min(analysisData.duration, getPlaybackTime() + 5)); }

function getPlaybackTime() {
  if (!isPlaying) return pauseOffset;
  return pauseOffset + (audioCtx.currentTime - startTime);
}

function updatePlayhead() {
  if (!isPlaying) return;
  const t = getPlaybackTime();
  const pct = timeToPct(t);
  document.getElementById('playheadWave').style.left = pct + '%';
  document.getElementById('playheadWords').style.left = pct + '%';
  document.getElementById('currentTime').textContent = fmtTime(t);
  highlightAtTime(t);
  animFrame = requestAnimationFrame(updatePlayhead);
}

function seekToTime(t) {
  t = Math.max(0, Math.min(t, analysisData.duration));
  pauseOffset = t;
  if (isPlaying) {
    sourceNode.stop();
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.connect(audioCtx.destination);
    sourceNode.onended = () => { isPlaying = false; pauseOffset = 0; document.getElementById('playBtn').textContent = '▶'; };
    startTime = audioCtx.currentTime;
    sourceNode.start(0, t);
  }
  const pct = timeToPct(t);
  document.getElementById('playheadWave').style.left = pct + '%';
  document.getElementById('playheadWords').style.left = pct + '%';
  document.getElementById('currentTime').textContent = fmtTime(t);
  highlightAtTime(t);
}

function timeToPct(t) {
  return ((t / (analysisData?.duration || 1)) * 100);
}

function highlightAtTime(t) {
  const lines = getLines();
  let activeLineIdx = -1;
  let activeWordGlobal = null;

  for (let i = 0; i < lines.length; i++) {
    const el = document.getElementById('line-' + i);
    if (!el) continue;
    if (t >= lines[i].start && t <= lines[i].end) {
      if (!el.classList.contains('active')) el.classList.add('active');
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      activeLineIdx = i;
    } else {
      el.classList.remove('active');
    }
  }

  if (activeLineIdx >= 0) {
    const line = lines[activeLineIdx];
    const lineEl = document.getElementById('line-words-' + activeLineIdx);
    if (lineEl) {
      const spans = lineEl.querySelectorAll('.word-span');
      const words = line.words || [];
      for (let j = 0; j < words.length && j < spans.length; j++) {
        if (t >= words[j].start && t <= words[j].end) {
          spans[j].classList.add('active');
          activeWordGlobal = { lineIdx: activeLineIdx, wordIdx: j };
        } else {
          spans[j].classList.remove('active');
        }
      }
    }
    document.getElementById('currentLyric').textContent = line.text;
  } else {
    document.getElementById('currentLyric').textContent = '';
  }

  document.querySelectorAll('.word').forEach(wEl => {
    const wStart = parseFloat(wEl.dataset.start);
    const wEnd = parseFloat(wEl.dataset.end);
    if (activeWordGlobal && t >= wStart && t <= wEnd) {
      wEl.classList.add('active');
    } else {
      wEl.classList.remove('active');
    }
  });

  if (activeLineIdx >= 0 && activeLineIdx !== selectedLineIdx) {
    highlightDetailWord(activeLineIdx, activeWordGlobal?.wordIdx);
  }
}

function highlightDetailWord(lineIdx, wordIdx) {
  const rows = document.querySelectorAll('.word-table tr[data-word-idx]');
  rows.forEach(r => {
    const wi = parseInt(r.dataset.wordIdx);
    if (wi === wordIdx) r.classList.add('active');
    else r.classList.remove('active');
  });
}

function getLines() {
  if (syncedData && syncedData.lines) return syncedData.lines;
  if (lyricsRaw && lyricsRaw.lines) return lyricsRaw.lines;
  return [];
}

function drawWaveform() {
  const canvas = document.getElementById('waveformCanvas');
  const container = document.getElementById('waveformContainer');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, w, h);

  if (!waveformPeaks.length) return;

  const barW = w / waveformPeaks.length;
  ctx.fillStyle = '#4cc9f0';
  for (let i = 0; i < waveformPeaks.length; i++) {
    const barH = waveformPeaks[i] * h * 0.8;
    ctx.fillRect(i * barW, (h - barH) / 2, Math.max(barW - 0.5, 0.5), barH);
  }

  if (beatTimes.length && analysisData) {
    ctx.strokeStyle = 'rgba(76,201,240,0.15)';
    ctx.lineWidth = 1;
    for (const bt of beatTimes) {
      const x = (bt / analysisData.duration) * w;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
  }
}

function renderTimeAxis() {
  const el = document.getElementById('timeAxis');
  el.innerHTML = '';
  if (!analysisData) return;
  const dur = analysisData.duration;
  const containerW = el.offsetWidth;
  const interval = dur > 120 ? 10 : (dur > 60 ? 5 : 2);
  for (let t = 0; t <= dur; t += interval) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.left = ((t / dur) * 100) + '%';
    tick.textContent = fmtTimeShort(t);
    el.appendChild(tick);
  }
}

function renderTranscript() {
  const el = document.getElementById('transcript');
  el.innerHTML = '';
  const lines = getLines();
  let lastSection = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const section = line.section;
    if (section && section.section_type !== (lastSection?.section_type)) {
      const hdr = document.createElement('div');
      hdr.className = 'section-header';
      hdr.textContent = section.raw_marker || section.section_type;
      el.appendChild(hdr);
      lastSection = section;
    }

    const item = document.createElement('div');
    item.className = 'line-item';
    item.id = 'line-' + i;

    const conf = line.alignment_confidence;
    const confClass = conf >= 0.8 ? 'conf-high' : (conf >= 0.5 ? 'conf-med' : 'conf-low');
    const confHtml = conf !== undefined ? `<span class="conf-bar ${confClass}"></span>` : '';

    const words = line.words || [];
    let wordsHtml = '';
    if (words.length) {
      wordsHtml = words.map(w => `<span class="word-span" data-line="${i}" data-word="${words.indexOf(w)}">${w.text}</span>`).join(' ');
    } else {
      wordsHtml = line.text;
    }

    item.innerHTML = `<div class="line-text" id="line-words-${i}">${wordsHtml}${confHtml}</div><div class="time-range">${fmtTime(line.start)} - ${fmtTime(line.end)}</div>`;
    item.onclick = () => selectLine(i);
    el.appendChild(item);
  }
}

function renderWordLayer() {
  const inner = document.getElementById('wordLayerInner');
  inner.innerHTML = '';
  if (!syncedData || !analysisData) return;

  const lines = syncedData.lines;
  const dur = analysisData.duration;
  const containerW = document.getElementById('wordLayer').offsetWidth;

  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    for (let j = 0; j < (line.words || []).length; j++) {
      const w = line.words[j];
      const left = (w.start / dur) * containerW;
      const width = Math.max(30, ((w.end - w.start) / dur) * containerW);
      const src = w.source || 'interpolated';
      const selClass = i === selectedLineIdx ? ' selected-line' : '';
      html += `<div class="word${selClass}" data-line="${i}" data-word="${j}" data-start="${w.start}" data-end="${w.end}" style="left:${left}px;width:${width}px">
        <div class="word-handle word-handle-left"></div>
        <span class="source-dot ${src}"></span><span>${w.text}</span>
        <div class="word-handle word-handle-right"></div>
      </div>`;
    }
  }
  inner.innerHTML = html;
  attachWordDragHandlers();
}

function positionWords() {
  if (!syncedData || !analysisData) return;
  const dur = analysisData.duration;
  const containerW = document.getElementById('wordLayer').offsetWidth;

  document.querySelectorAll('.word').forEach(wordEl => {
    const s = parseFloat(wordEl.dataset.start);
    const e = parseFloat(wordEl.dataset.end);
    wordEl.style.left = ((s / dur) * containerW) + 'px';
    wordEl.style.width = Math.max(30, ((e - s) / dur) * containerW) + 'px';
  });
}

function attachWordDragHandlers() {
  document.querySelectorAll('.word').forEach(wordEl => {
    wordEl.addEventListener('mousedown', handleWordMouseDown);
  });
}

function handleWordMouseDown(e) {
  const wordEl = e.target.closest('.word');
  if (!wordEl || !syncedData) return;

  draggingWord = wordEl;
  wordDragStartX = e.clientX;
  wordDragStartTime = parseFloat(wordEl.dataset.start);
  wordDragEndTime = parseFloat(wordEl.dataset.end);

  if (e.target.classList.contains('word-handle-left')) {
    dragType = 'left';
  } else if (e.target.classList.contains('word-handle-right')) {
    dragType = 'right';
  } else {
    dragType = 'move';
  }

  wordEl.classList.add('dragging');
  e.preventDefault();
}

function handleWordMouseMove(e) {
  if (!draggingWord || !syncedData || !analysisData) return;

  const containerW = document.getElementById('wordLayer').offsetWidth;
  const deltaX = e.clientX - wordDragStartX;
  const deltaTime = (deltaX / containerW) * analysisData.duration;

  const lineIdx = parseInt(draggingWord.dataset.line);
  const wordIdx = parseInt(draggingWord.dataset.word);
  const line = syncedData.lines[lineIdx];
  const word = line.words[wordIdx];
  const lowerBound = line.start;
  const upperBound = line.end;

  if (dragType === 'move') {
    const duration = wordDragEndTime - wordDragStartTime;
    const newStart = Math.max(lowerBound, Math.min(upperBound - duration, wordDragStartTime + deltaTime));
    word.start = newStart;
    word.end = newStart + duration;
  } else if (dragType === 'left') {
    const maxStart = word.end - MIN_WORD_DURATION;
    let newStart = wordDragStartTime + deltaTime;
    if (wordIdx > 0) {
      const prevWord = line.words[wordIdx - 1];
      newStart = Math.max(prevWord.start + MIN_WORD_DURATION, newStart);
    } else {
      newStart = Math.max(lowerBound, newStart);
    }
    newStart = Math.min(maxStart, newStart);
    if (wordIdx > 0) line.words[wordIdx - 1].end = newStart;
    word.start = newStart;
  } else if (dragType === 'right') {
    const minEnd = word.start + MIN_WORD_DURATION;
    let newEnd = wordDragEndTime + deltaTime;
    if (wordIdx < line.words.length - 1) {
      const nextWord = line.words[wordIdx + 1];
      newEnd = Math.min(nextWord.end - MIN_WORD_DURATION, newEnd);
    } else {
      newEnd = Math.min(upperBound, newEnd);
    }
    newEnd = Math.max(minEnd, newEnd);
    if (wordIdx < line.words.length - 1) line.words[wordIdx + 1].start = newEnd;
    word.end = newEnd;
  }

  draggingWord.dataset.start = word.start;
  draggingWord.dataset.end = word.end;
  positionWords();
  markUnsaved();

  if (lineIdx === selectedLineIdx) renderDetail(line);
}

function handleWordMouseUp() {
  if (draggingWord) {
    draggingWord.classList.remove('dragging');
    draggingWord = null;
  }
}

document.addEventListener('mousemove', handleWordMouseMove);
document.addEventListener('mouseup', handleWordMouseUp);

function selectLine(idx) {
  selectedLineIdx = idx;
  const lines = getLines();

  document.querySelectorAll('.line-item').forEach(el => el.style.background = '');
  const el = document.getElementById('line-' + idx);
  if (el) el.style.background = '#0f3460';

  document.querySelectorAll('.word').forEach(w => {
    w.classList.toggle('selected-line', parseInt(w.dataset.line) === idx);
  });

  renderDetail(lines[idx]);
  seekToTime(lines[idx].start);
}

function renderDetail(line) {
  const el = document.getElementById('detailPanel');
  if (!line) { el.innerHTML = '<p style="color:#666;font-size:13px">Select a line</p>'; return; }

  let html = `<div class="detail-header">"${line.text}"</div>`;
  html += `<div class="detail-meta">Start: ${line.start.toFixed(3)}s — End: ${line.end.toFixed(3)}s (${(line.end - line.start).toFixed(2)}s)</div>`;

  const words = line.words || [];
  if (words.length) {
    html += `<table class="word-table"><thead><tr><th>Word</th><th>Start</th><th>End</th><th>Source</th></tr></thead><tbody>`;
    for (let j = 0; j < words.length; j++) {
      const w = words[j];
      const src = w.source || 'interpolated';
      html += `<tr data-word-idx="${j}">
        <td style="font-weight:600">${w.text}</td>
        <td><input class="time-input" type="number" step="0.01" value="${w.start.toFixed(3)}" data-line="${selectedLineIdx}" data-word="${j}" data-field="start"></td>
        <td><input class="time-input" type="number" step="0.01" value="${w.end.toFixed(3)}" data-line="${selectedLineIdx}" data-word="${j}" data-field="end"></td>
        <td><span class="source-badge ${src}">${src}</span></td>
      </tr>`;
    }
    html += `</tbody></table>`;
  }

  el.innerHTML = html;

  el.querySelectorAll('.time-input').forEach(input => {
    input.addEventListener('change', (e) => {
      const li = parseInt(e.target.dataset.line);
      const wi = parseInt(e.target.dataset.word);
      const field = e.target.dataset.field;
      const val = parseFloat(e.target.value);
      if (isNaN(val) || !syncedData) return;

      const word = syncedData.lines[li].words[wi];
      if (field === 'start') {
        word.start = Math.min(val, word.end - MIN_WORD_DURATION);
      } else {
        word.end = Math.max(val, word.start + MIN_WORD_DURATION);
      }

      const wordEl = document.querySelector(`.word[data-line="${li}"][data-word="${wi}"]`);
      if (wordEl) {
        wordEl.dataset.start = word.start;
        wordEl.dataset.end = word.end;
      }
      positionWords();
      markUnsaved();
    });
  });
}

async function autoSync() {
  setStatus('Running auto-sync...');
  try {
    const res = await fetch(`${API}/api/auto-sync`, { method: 'POST' });
    const data = await res.json();
    if (data.error) { setStatus('Error: ' + data.error); return; }
    syncedData = data;
    renderTranscript();
    renderWordLayer();
    markUnsaved();
    setStatus(`Auto-sync: ${data.lines?.length || 0} lines, ${((data.avg_confidence || 0) * 100).toFixed(0)}% confidence`);
  } catch (e) {
    setStatus('Auto-sync error: ' + e.message);
  }
}

async function save() {
  if (!syncedData) { setStatus('Nothing to save'); return; }
  try {
    const res = await fetch(`${API}/api/lyrics-synced`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(syncedData),
    });
    const data = await res.json();
    if (data.status === 'saved') {
      markSaved();
      setStatus('Saved!');
    } else {
      setStatus('Error: ' + (data.error || 'unknown'));
    }
  } catch (e) {
    setStatus('Save error: ' + e.message);
  }
}

function clearTiming() {
  if (!syncedData) return;
  syncedData = null;
  selectedLineIdx = -1;
  renderTranscript();
  renderWordLayer();
  document.getElementById('detailPanel').innerHTML = '<p style="color:#666;font-size:13px">Timing cleared. Use Auto-Sync.</p>';
  markUnsaved();
  setStatus('Timing cleared');
}

function shiftAll(delta) {
  if (!syncedData) return;
  for (const line of syncedData.lines) {
    line.start += delta;
    line.end += delta;
    for (const w of (line.words || [])) {
      w.start += delta;
      w.end += delta;
    }
  }
  renderTranscript();
  renderWordLayer();
  if (selectedLineIdx >= 0) renderDetail(syncedData.lines[selectedLineIdx]);
  markUnsaved();
  setStatus(`Shifted all by ${delta > 0 ? '+' : ''}${delta}s`);
}

function fmtTime(s) {
  if (s === undefined || s === null) return '0:00.0';
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return `${m}:${sec.toFixed(1).padStart(4, '0')}`;
}

function fmtTimeShort(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s - m * 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function markUnsaved() {
  hasUnsavedChanges = true;
  const el = document.getElementById('saveStatus');
  el.textContent = 'Unsaved';
  el.className = 'save-status unsaved';
}

function markSaved() {
  hasUnsavedChanges = false;
  const el = document.getElementById('saveStatus');
  el.textContent = 'Saved';
  el.className = 'save-status saved';
  setTimeout(() => { el.textContent = ''; }, 2000);
}

document.getElementById('waveformContainer').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  seekToTime(pct * analysisData.duration);
});

document.getElementById('wordLayer').addEventListener('click', (e) => {
  if (e.target.closest('.word')) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  seekToTime(pct * analysisData.duration);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); skipBack(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); skipForward(); }
  else if (e.code === 'Escape') {
    selectedLineIdx = -1;
    document.querySelectorAll('.line-item').forEach(el => el.style.background = '');
    document.querySelectorAll('.word').forEach(w => w.classList.remove('selected-line'));
    document.getElementById('detailPanel').innerHTML = '<p style="color:#666;font-size:13px">Select a line</p>';
  }
});

window.addEventListener('beforeunload', (e) => {
  if (hasUnsavedChanges) { e.preventDefault(); e.returnValue = ''; }
});

window.addEventListener('resize', () => { drawWaveform(); renderTimeAxis(); renderWordLayer(); });

init();
</script>
</body>
</html>
